plugins {
    id 'fabric-loom' version '1.7.4'
}
group = 'jp.seiyo'
version = '1.2.0+mc1.19.2'
repositories { mavenCentral() }

dependencies {
    minecraft 'com.mojang:minecraft:1.19.2'
    mappings 'net.fabricmc:yarn:1.19.2+build.28:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.14.25'
}

loom { mixin.useLegacyMixinAp = false }

tasks.withType(JavaCompile).configureEach {
    options.release = 17
    options.encoding = 'UTF-8'
}

tasks.named('processResources') {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}

tasks.register('updateWorkerJar', Jar) {
    dependsOn tasks.named('compileJava')
    archiveFileName = 'seiyo-update-worker.jar'
    destinationDirectory = layout.buildDirectory.dir('worker')
    from(tasks.named('compileJava').flatMap { it.destinationDirectory }) {
        include 'jp/seiyo/updater/UpdateWorker*.class'
    }
}
tasks.named('jar') {
    from(tasks.named('updateWorkerJar').flatMap { it.archiveFile })
}

tasks.register('bootstrapJar', Jar) {
    dependsOn tasks.named('compileJava')
    archiveFileName = 'seiyo-bootstrap.jar'
    from(tasks.named('compileJava').flatMap { it.destinationDirectory }) {
        include 'jp/seiyo/updater/ArchiveBootstrap.class'
        include 'jp/seiyo/updater/RuntimeFiles.class'
        include 'jp/seiyo/updater/PackedArchive*.class'
        include 'jp/seiyo/updater/UpdateWorker*.class'
    }
    manifest { attributes('Premain-Class': 'jp.seiyo.updater.ArchiveBootstrap') }
}
tasks.named('assemble') { dependsOn tasks.named('bootstrapJar') }
